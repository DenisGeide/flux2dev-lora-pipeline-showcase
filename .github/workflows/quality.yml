name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the public manifest example
        run: python scripts/validate_dataset_manifest.py data/dataset-manifest.example.json
      - name: Check generated experiment report
        run: python scripts/build_experiment_report.py --check
