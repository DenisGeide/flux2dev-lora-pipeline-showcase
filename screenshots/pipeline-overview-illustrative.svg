<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative FLUX LoRA experiment pipeline</title>
  <desc id="desc">A sanitized diagram showing licensed data preparation, validation, training, safe reporting, and fixed-seed evaluation. It is not a model output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6ee7f9"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">FLUX LoRA experiment pipeline</text>
  <text x="60" y="103" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="17">SANITIZED ILLUSTRATION • NOT A MODEL OUTPUT • NO PRIVATE DATA</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="55" y="175" width="190" height="185" rx="18" fill="#152d4a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="215" r="25" fill="#0ea5e9"/>
    <text x="150" y="223" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
    <text x="150" y="269" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Licensed data</text>
    <text x="150" y="301" text-anchor="middle" fill="#b9c8db" font-size="15">images + captions</text>
    <text x="150" y="326" text-anchor="middle" fill="#b9c8db" font-size="15">rights recorded</text>

    <rect x="280" y="175" width="190" height="185" rx="18" fill="#152d4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="375" cy="215" r="25" fill="#14b8a6"/>
    <text x="375" y="223" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
    <text x="375" y="269" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Validate</text>
    <text x="375" y="301" text-anchor="middle" fill="#b9c8db" font-size="15">manifest + pairs</text>
    <text x="375" y="326" text-anchor="middle" fill="#b9c8db" font-size="15">hashes + splits</text>

    <rect x="505" y="175" width="190" height="185" rx="18" fill="#152d4a" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="600" cy="215" r="25" fill="#8b5cf6"/>
    <text x="600" y="223" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
    <text x="600" y="269" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Train adapter</text>
    <text x="600" y="301" text-anchor="middle" fill="#b9c8db" font-size="15">AI-Toolkit config</text>
    <text x="600" y="326" text-anchor="middle" fill="#b9c8db" font-size="15">smoke test first</text>

    <rect x="730" y="175" width="190" height="185" rx="18" fill="#152d4a" stroke="#fb923c" stroke-width="2"/>
    <circle cx="825" cy="215" r="25" fill="#f97316"/>
    <text x="825" y="223" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text>
    <text x="825" y="269" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Safe report</text>
    <text x="825" y="301" text-anchor="middle" fill="#b9c8db" font-size="15">loss + speed + status</text>
    <text x="825" y="326" text-anchor="middle" fill="#b9c8db" font-size="15">paths removed</text>

    <rect x="955" y="175" width="190" height="185" rx="18" fill="#152d4a" stroke="#f472b6" stroke-width="2"/>
    <circle cx="1050" cy="215" r="25" fill="#ec4899"/>
    <text x="1050" y="223" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text>
    <text x="1050" y="269" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Evaluate</text>
    <text x="1050" y="301" text-anchor="middle" fill="#b9c8db" font-size="15">fixed seed + prompt ID</text>
    <text x="1050" y="326" text-anchor="middle" fill="#b9c8db" font-size="15">blind comparison</text>
  </g>

  <g stroke="#6ee7f9" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M245 267H272"/>
    <path d="M470 267H497"/>
    <path d="M695 267H722"/>
    <path d="M920 267H947"/>
  </g>

  <rect x="55" y="411" width="1090" height="62" rx="14" fill="#0b1a2c" stroke="#334155"/>
  <text x="600" y="438" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">PUBLIC REPOSITORY BOUNDARY</text>
  <text x="600" y="461" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">sanitized configs, aggregate evidence and documentation only • data, weights, raw logs and generated images stay local</text>
</svg>
