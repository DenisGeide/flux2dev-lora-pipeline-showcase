<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative generic ComfyUI workflow</title>
  <desc id="desc">A sanitized node diagram for a generic base model and optional LoRA adapter inference flow. It is not an exported private ComfyUI workflow or a model output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#1b2440"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="52" y="59" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Generic ComfyUI evaluation workflow</text>
  <text x="52" y="94" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="17">SANITIZED ILLUSTRATION • NOT A WORKFLOW EXPORT • NOT A MODEL OUTPUT</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g>
      <rect x="55" y="163" width="205" height="104" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <rect x="55" y="163" width="205" height="28" rx="14" fill="#2563eb"/>
      <text x="70" y="184" fill="#fff" font-size="14" font-weight="700">LOAD BASE MODEL</text>
      <text x="73" y="224" fill="#dbeafe" font-size="15">licensed local file</text>
      <text x="73" y="248" fill="#93c5fd" font-size="13">hash recorded privately</text>
    </g>
    <g>
      <rect x="55" y="330" width="205" height="104" rx="14" fill="#3b1d4a" stroke="#f472b6" stroke-width="2"/>
      <rect x="55" y="330" width="205" height="28" rx="14" fill="#db2777"/>
      <text x="70" y="351" fill="#fff" font-size="14" font-weight="700">OPTIONAL ADAPTER</text>
      <text x="73" y="391" fill="#fce7f3" font-size="15">LoRA + strength</text>
      <text x="73" y="415" fill="#f9a8d4" font-size="13">same checkpoint per arm</text>
    </g>
    <g>
      <rect x="362" y="118" width="205" height="104" rx="14" fill="#173447" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="362" y="118" width="205" height="28" rx="14" fill="#0f766e"/>
      <text x="377" y="139" fill="#fff" font-size="14" font-weight="700">PROMPT TEMPLATE</text>
      <text x="380" y="179" fill="#ccfbf1" font-size="15">public prompt ID</text>
      <text x="380" y="203" fill="#5eead4" font-size="13">text stored outside diagram</text>
    </g>
    <g>
      <rect x="362" y="279" width="205" height="104" rx="14" fill="#3d3418" stroke="#facc15" stroke-width="2"/>
      <rect x="362" y="279" width="205" height="28" rx="14" fill="#a16207"/>
      <text x="377" y="300" fill="#fff" font-size="14" font-weight="700">FIXED SETTINGS</text>
      <text x="380" y="340" fill="#fef9c3" font-size="15">seed • steps • sampler</text>
      <text x="380" y="364" fill="#fde047" font-size="13">resolution • guidance</text>
    </g>
    <g>
      <rect x="663" y="205" width="205" height="104" rx="14" fill="#2e2450" stroke="#a78bfa" stroke-width="2"/>
      <rect x="663" y="205" width="205" height="28" rx="14" fill="#7c3aed"/>
      <text x="678" y="226" fill="#fff" font-size="14" font-weight="700">SAMPLE LATENT</text>
      <text x="681" y="266" fill="#ede9fe" font-size="15">scheduler + sampler</text>
      <text x="681" y="290" fill="#c4b5fd" font-size="13">identical settings per arm</text>
    </g>
    <g>
      <rect x="955" y="205" width="190" height="104" rx="14" fill="#173447" stroke="#34d399" stroke-width="2"/>
      <rect x="955" y="205" width="190" height="28" rx="14" fill="#059669"/>
      <text x="970" y="226" fill="#fff" font-size="14" font-weight="700">DECODE + RECORD</text>
      <text x="973" y="266" fill="#d1fae5" font-size="15">local output</text>
      <text x="973" y="290" fill="#6ee7b7" font-size="13">metadata sidecar</text>
    </g>
  </g>

  <g fill="none" stroke-width="4">
    <path d="M260 215H655" stroke="#22d3ee" marker-end="url(#cyanArrow)"/>
    <path d="M260 382H610Q635 382 635 357V294Q635 257 655 257" stroke="#a78bfa" marker-end="url(#purpleArrow)"/>
    <path d="M567 170H610Q635 170 635 205V225Q635 257 655 257" stroke="#22d3ee" marker-end="url(#cyanArrow)"/>
    <path d="M567 331H610Q635 331 635 300V278Q635 257 655 257" stroke="#22d3ee" marker-end="url(#cyanArrow)"/>
    <path d="M868 257H947" stroke="#22d3ee" marker-end="url(#cyanArrow)"/>
  </g>

  <rect x="55" y="491" width="1090" height="57" rx="13" fill="#101827" stroke="#334155"/>
  <text x="600" y="516" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">The included JSON describes the expected public structure.</text>
  <text x="600" y="538" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">It intentionally omits private paths, prompts, output files and machine-specific node state.</text>
</svg>
