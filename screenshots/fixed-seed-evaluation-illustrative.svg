<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative fixed-seed adapter evaluation protocol</title>
  <desc id="desc">A sanitized process diagram comparing a base arm and an adapter arm using identical settings before blind review. No generated images are displayed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081421"/>
      <stop offset="1" stop-color="#1d2a42"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Fixed-seed evaluation protocol</text>
  <text x="58" y="97" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="17">SANITIZED ILLUSTRATION • PLACEHOLDER PANELS • NO GENERATED IMAGES</text>

  <rect x="58" y="147" width="1084" height="76" rx="16" fill="#10273d" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="177" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">LOCKED EVALUATION RECORD</text>
  <text x="600" y="204" text-anchor="middle" fill="#bae6fd" font-family="Consolas,monospace" font-size="15">prompt_id=eval-001 • seed=42 • steps=24 • sampler=fixed • resolution=768×768</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="58" y="278" width="285" height="195" rx="18" fill="#152d4a" stroke="#60a5fa" stroke-width="2"/>
    <text x="200" y="313" text-anchor="middle" fill="#bfdbfe" font-size="18" font-weight="700">ARM A • BASE</text>
    <rect x="91" y="337" width="219" height="91" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-dasharray="8 6"/>
    <text x="200" y="377" text-anchor="middle" fill="#93c5fd" font-size="15">OUTPUT PLACEHOLDER</text>
    <text x="200" y="402" text-anchor="middle" fill="#64748b" font-size="13">generated locally, not published</text>
    <text x="200" y="451" text-anchor="middle" fill="#cbd5e1" font-size="14">adapter disabled</text>

    <rect x="457" y="278" width="285" height="195" rx="18" fill="#30234f" stroke="#c084fc" stroke-width="2"/>
    <text x="599" y="313" text-anchor="middle" fill="#e9d5ff" font-size="18" font-weight="700">ARM B • ADAPTER</text>
    <rect x="490" y="337" width="219" height="91" rx="12" fill="#3b2863" stroke="#a855f7" stroke-dasharray="8 6"/>
    <text x="599" y="377" text-anchor="middle" fill="#d8b4fe" font-size="15">OUTPUT PLACEHOLDER</text>
    <text x="599" y="402" text-anchor="middle" fill="#64748b" font-size="13">generated locally, not published</text>
    <text x="599" y="451" text-anchor="middle" fill="#cbd5e1" font-size="14">adapter + fixed strength</text>

    <rect x="856" y="278" width="286" height="195" rx="18" fill="#153b36" stroke="#34d399" stroke-width="2"/>
    <text x="999" y="313" text-anchor="middle" fill="#a7f3d0" font-size="18" font-weight="700">BLIND REVIEW</text>
    <text x="893" y="356" fill="#d1fae5" font-size="15">□ prompt alignment</text>
    <text x="893" y="386" fill="#d1fae5" font-size="15">□ detail retention</text>
    <text x="893" y="416" fill="#d1fae5" font-size="15">□ visible artifacts</text>
    <text x="893" y="446" fill="#d1fae5" font-size="15">□ reviewer confidence</text>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)">
    <path d="M343 376H449"/>
    <path d="M742 376H848"/>
  </g>

  <text x="600" y="535" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="16">Publish the protocol and aggregate scores only when image rights and run provenance are clear.</text>
</svg>
