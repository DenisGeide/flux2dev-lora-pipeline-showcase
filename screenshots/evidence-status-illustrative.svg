<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative experiment status and evidence matrix</title>
  <desc id="desc">A sanitized decision matrix showing how logs, checkpoints, failures, and conflicts map to experiment statuses. It is not a model output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#192b43"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="570" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Experiment status is evidence-driven</text>
  <text x="58" y="97" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="17">SANITIZED ILLUSTRATION • GENERIC RULES • NOT A MODEL OUTPUT</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="58" y="143" width="1084" height="58" rx="12" fill="#10273d"/>
    <text x="90" y="179" fill="#e2e8f0" font-size="16" font-weight="700">STATUS</text>
    <text x="320" y="179" fill="#e2e8f0" font-size="16" font-weight="700">REQUIRED / OBSERVED EVIDENCE</text>
    <text x="925" y="179" fill="#e2e8f0" font-size="16" font-weight="700">PUBLIC CLAIM</text>

    <rect x="58" y="213" width="1084" height="70" rx="12" fill="#12372f" stroke="#34d399"/>
    <rect x="77" y="230" width="181" height="36" rx="18" fill="#059669"/>
    <text x="168" y="254" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">COMPLETED</text>
    <text x="320" y="244" fill="#d1fae5" font-size="15">terminal progress + final checkpoint event</text>
    <text x="320" y="266" fill="#6ee7b7" font-size="13">validation records may support qualitative review</text>
    <text x="925" y="254" fill="#d1fae5" font-size="15">completion supported</text>

    <rect x="58" y="295" width="1084" height="70" rx="12" fill="#3b2814" stroke="#fb923c"/>
    <rect x="77" y="312" width="181" height="36" rx="18" fill="#ea580c"/>
    <text x="168" y="336" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">INTERRUPTED</text>
    <text x="320" y="326" fill="#ffedd5" font-size="15">numbered checkpoints, no final completion evidence</text>
    <text x="320" y="348" fill="#fdba74" font-size="13">stop reason may be unknown</text>
    <text x="925" y="336" fill="#ffedd5" font-size="15">partial run only</text>

    <rect x="58" y="377" width="1084" height="70" rx="12" fill="#3e1d28" stroke="#fb7185"/>
    <rect x="77" y="394" width="181" height="36" rx="18" fill="#e11d48"/>
    <text x="168" y="418" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">FAILED OOM</text>
    <text x="320" y="408" fill="#ffe4e6" font-size="15">OOM event + no optimizer progress or completion</text>
    <text x="320" y="430" fill="#fda4af" font-size="13">failure stage retained as useful evidence</text>
    <text x="925" y="418" fill="#ffe4e6" font-size="15">failure reported</text>

    <rect x="58" y="459" width="1084" height="70" rx="12" fill="#2f2450" stroke="#a78bfa"/>
    <rect x="77" y="476" width="181" height="36" rx="18" fill="#7c3aed"/>
    <text x="168" y="500" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">MIXED EVIDENCE</text>
    <text x="320" y="490" fill="#ede9fe" font-size="15">artifacts and surviving log cannot be safely merged</text>
    <text x="320" y="512" fill="#c4b5fd" font-size="13">keep ambiguity explicit</text>
    <text x="925" y="500" fill="#ede9fe" font-size="15">no completion claim</text>
  </g>
</svg>
