# Public AI-Toolkit example config for FLUX2DEV LoRA training.
# This file is a sanitized public baseline informed by historical FLUX.2 attempts.
# The local audit does not contain an unambiguous completed FLUX.2 log, so this
# file must not be presented as a proven universal recipe. Start with a smoke run.
# AI-Toolkit schema can change; verify it against the revision you install.

job: "extension"

config:
  name: "flux2dev_lora_example"

  process:
    - type: "diffusion_trainer"
      device: "cuda"
      trigger_word: "synthetic_object_token"
      training_folder: "./output"
      performance_log_every: 10

      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
        conv: 0
        conv_alpha: 0
        lokr_full_rank: false
        lokr_factor: -1

      save:
        dtype: "bf16"
        save_every: 250
        max_step_saves_to_keep: 5
        save_format: "diffusers"
        push_to_hub: false

      datasets:
        - folder_path: "./datasets/synthetic-object"
          caption_ext: "txt"
          default_caption: ""
          resolution:
            - 768
          num_repeats: 10
          flip_x: true
          flip_y: false
          cache_latents_to_disk: true

      train:
        batch_size: 1
        steps: 1800
        gradient_accumulation: 1
        gradient_checkpointing: true
        train_unet: true
        train_text_encoder: false
        optimizer: "adamw8bit"
        lr: 0.0001
        noise_scheduler: "flowmatch"
        cache_text_embeddings: true
        diff_output_preservation: false
        dtype: "bf16"

      logging:
        log_every: 1
        use_ui_logger: true

      model:
        name_or_path: "black-forest-labs/FLUX.2-dev"
        arch: "flux2"
        quantize: true
        quantize_te: true
        low_vram: true
        layer_offloading: true
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1

      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 768
        height: 768
        guidance_scale: 1
        sample_steps: 20
        seed: 42
        samples:
          - prompt: "synthetic_object_token, abstract ceramic object, neutral studio background"
          - prompt: "synthetic_object_token, geometric installation, soft directional light"
          - prompt: "synthetic_object_token, product study, clean white background"
          - prompt: "synthetic_object_token, stylized sculpture, high-contrast lighting"

meta:
  version: "1.0"
  provenance: "Sanitized baseline informed by historical observational configs; not a controlled result."
  note: "Replace the synthetic token, dataset path, and prompt IDs locally. Run a short smoke test before committing to 1800 steps."
