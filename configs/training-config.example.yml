# Public example config for the FLUX2DEV LoRA training workflow.
# This is a sanitized reference based on one working local experiment.
# Private local paths, paid model URLs, secrets and personal data are intentionally omitted.

project:
  name: flux2dev-lora-showcase
  base_model: black-forest-labs/FLUX.2-dev
  training_framework: AI-Toolkit

dataset:
  size: "20-35 images"
  path: "datasets/example-target"
  captions: "txt files"
  trigger_word: "example_trigger"
  resolution: 768
  num_repeats: 10
  flip_x: true
  flip_y: false
  cache_latents_to_disk: true

training:
  duration: "6-7 hours"
  lora_type: lora
  rank: 16
  alpha: 16
  conv: 0
  conv_alpha: 0
  optimizer: adamw8bit
  learning_rate: 0.0001
  batch_size: 1
  gradient_accumulation: 1
  gradient_checkpointing: true
  steps: 1800
  train_unet: true
  train_text_encoder: false
  dtype: bf16
  noise_scheduler: flowmatch
  cache_text_embeddings: true
  diff_output_preservation: true

memory:
  main_issue: "VRAM pressure / OOM"
  stabilization:
    - custom training config
    - memory balancing
    - offloading where applicable
    - FP8-related optimization where applicable

model:
  arch: flux2
  quantize: true
  quantize_text_encoder: true
  low_vram: true
  layer_offloading: true

sampling:
  sampler: flowmatch
  sample_every: 250
  width: 768
  height: 768
  guidance_scale: 1
  sample_steps: 20
  seed: 42

release_scope:
  include_lora_weights: false
  include_private_dataset: false
  include_paid_model_files: false
  include_private_paths: false
