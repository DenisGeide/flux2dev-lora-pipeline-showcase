# Human-readable experiment metadata.
# This file is documentation and is NOT consumed by AI-Toolkit.
# Use one of the ai-toolkit-*.example.yml files for actual training.

experiment:
  id: public-run-001
  status: planned
  hypothesis: "Write one falsifiable statement before training."
  controlled_ablation: false

provenance:
  trainer: ostris/ai-toolkit
  trainer_revision: "record-git-commit-here"
  base_model: black-forest-labs/FLUX.1-dev
  dataset_manifest: path/to/manifest.json
  dataset_version: "1.0.0"
  config_file: configs/ai-toolkit-flux1dev-lora.example.yml

environment:
  gpu: "record-model"
  driver: "record-version"
  python: "record-version"
  torch: "record-version"

training:
  seed: 42
  steps: 2250
  lora_rank: 32
  lora_alpha: 32
  optimizer: adamw8bit
  learning_rate: 0.0004
  batch_size: 1
  gradient_accumulation: 1
  dtype: bf16
  gradient_checkpointing: true

evaluation:
  validation_prompt_set: "versioned/fixed"
  validation_seeds:
    - 101
    - 202
    - 303
  record:
    - final_status
    - loss_curve
    - wall_clock_seconds
    - median_seconds_per_iteration
    - peak_vram_mib
    - checkpoint_size_bytes
    - validation_outputs
    - failure_stage

release:
  include_config: true
  include_sanitized_report: true
  include_raw_log: false
  include_dataset: false
  include_lora_weights: false
  include_optimizer_state: false
  include_private_paths: false
